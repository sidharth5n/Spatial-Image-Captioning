seed_everything: true

trainer:
  logger: true
  accelerator: gpu
  devices: 0
  val_check_interval: 2000
  limit_val_batches: 200
  log_every_n_steps: 15
  max_epochs: 30
  enable_checkpointing: true
  enable_progress_bar: true
  inference_mode: false
  gradient_clip_val: 0.1
  gradient_clip_algorithm: value
  callbacks:
    - class_path: pytorch_lightning.callbacks.ModelCheckpoint
      init_args:
        monitor: train/loss
        filename: best_train_loss
        save_weights_only: true
        every_n_train_steps: 
    - class_path: pytorch_lightning.callbacks.ModelCheckpoint
      init_args:
        monitor: val/loss
        filename: best_val_loss
        save_weights_only: true
        every_n_epochs: 1
    - class_path: pytorch_lightning.callbacks.ModelCheckpoint
      init_args:
        monitor: val/cider
        filename: best_val_cider
        save_weights_only: true
        every_n_epochs: 1
    - class_path: pytorch_lightning.callbacks.ModelCheckpoint
      init_args:
        filename: model
        every_n_epochs: 1
        save_on_train_epoch_end: true

data:
  class_path: data.modules.COCODataModule
  init_args:
    root: 'data'
    input_json: dataset_coco.json
    input_fc_feat_dir: cocobu_fc
    input_img_feat_dir: cocobu_att
    input_box_dir: cocobu_box
    input_rel_box_dir: cocobu_rel_box
    input_grid_vec_dir: cocobu_box_vec
    input_label_h5: coco_label.h5
    norm_img_feat: false
    norm_box_feat: false
    seq_per_img: 5
    batch_size: 16
    trainonly: false

checkpoint: checkpoints
logs: logs
